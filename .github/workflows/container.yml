name: Container

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm exec vp fmt --check

      - name: Lint
        run: pnpm exec vp lint

      - name: Test
        run: pnpm exec vp test --run

      - name: Run production browser smoke
        run: pnpm run smoke:web

      - name: Build stateless container
        run: docker build --tag zmail:ci .

      - name: Smoke the built stateless container
        run: pnpm run smoke:container
        env:
          ZMAIL_SMOKE_IMAGE: zmail:ci
          ZMAIL_SMOKE_SKIP_BUILD: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Tag and push verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag zmail:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
